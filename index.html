<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統流程圖工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="toolbar">
    <span class="brand">🔀 系統流程圖工具</span>
    <span class="sep"></span>
    <button class="btn" id="btnUndo" title="復原 (Ctrl+Z)">↶ 復原</button>
    <button class="btn" id="btnRedo" title="重做 (Ctrl+Shift+Z)">↷ 重做</button>
    <span class="sep"></span>
    <button class="btn primary" id="btnExportPng" title="將整張圖匯出成 PNG 圖片">🖼 匯出 PNG</button>
    <button class="btn" id="btnExportJson" title="下載流程圖資料 (JSON)">📥 匯出 JSON</button>
    <button class="btn" id="btnImportJson" title="從 JSON 檔匯入">📤 匯入 JSON</button>
    <span class="sep"></span>
    <button class="btn" id="btnClear" title="清空畫布">🗑 清空</button>
    <button class="btn active" id="btnSnap" title="網格吸附與對齊（開/關）">🧲 吸附</button>
    <span class="sep"></span>
    <button class="btn" id="btnZoomOut" title="縮小">−</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="btn" id="btnZoomIn" title="放大">＋</button>
    <button class="btn" id="btnZoomReset" title="回復 100%">重置</button>
    <span class="sep"></span>
    <span class="swatches" id="swatches" title="先點選節點，再點顏色變更其底色"></span>
    <span class="sep"></span>
    <button class="btn" id="btnCopy" title="複製選取的節點 (Ctrl+C)">⧉ 複製</button>
    <button class="btn" id="btnPaste" title="貼上 (Ctrl+V)">📋 貼上</button>
    <button class="btn" id="btnAutoLayout" title="自動排版">🧭 排版</button>
    <button class="btn" id="btnExportSvg" title="匯出向量 SVG">📐 SVG</button>
    <button class="btn" id="btnTheme" title="深色/淺色模式">🌙</button>
    <span class="sep"></span>
    <button class="btn" id="btnLineSolid" title="連線改實線">─ 實線</button>
    <button class="btn" id="btnLineDashed" title="連線改虛線">┄ 虛線</button>
    <span class="swatches" id="lineColors" title="點選連線後再點顏色"></span>
    <button class="btn" id="btnOrtho" title="直角連線（開/關）">∟ 直角</button>
    <span class="sep"></span>
    <button class="btn" id="alL" title="靠左對齊">⇤</button>
    <button class="btn" id="alC" title="水平置中">⇹</button>
    <button class="btn" id="alR" title="靠右對齊">⇥</button>
    <button class="btn" id="alT" title="靠上對齊">⇪</button>
    <button class="btn" id="alM" title="垂直置中">⇳</button>
    <button class="btn" id="alB" title="靠下對齊">⇩</button>
    <button class="btn" id="distH" title="水平等距分布">↔</button>
    <button class="btn" id="distV" title="垂直等距分布">↕</button>
    <span class="sep"></span>
    <input type="search" id="searchBox" placeholder="🔍 搜尋節點" title="輸入文字搜尋節點，Enter 跳到下一個，Esc 清除">
    <button class="btn" id="btnPrint" title="列印 / 匯出 PDF">🖨 列印</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="main">
    <aside class="palette">
      <h3>元件 (拖曳到畫布)</h3>
      <div id="paletteList"></div>
    </aside>
    <main class="canvas-wrap">
      <div id="drawflow"></div>
    </main>
  </div>

  <div class="hint">
    <b>操作：</b> 從左側<b>拖曳元件</b>到畫布 →
    <b>點選文字</b>即可編輯 →
    右側<b>圓點拉到左側圓點</b>建立連線 →
    <b>右鍵 / Delete</b> 刪除 →
    <b>Ctrl+滾輪</b> 縮放 →
    <b>拖曳空白處</b> 平移 →
    <b>Shift+拖曳</b> 框選多個節點 →
    <b>Ctrl+C/V/D</b> 複製/貼上/重製 →
    <b>雙擊連線標籤</b> 可改文字
  </div>

  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#64748b" />
      </marker>
    </defs>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
